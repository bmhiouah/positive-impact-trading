[project]
name = "marketmind"
version = "0.1.0"
description = "Data-driven long-only IBKR paper-trading lab: scalable universe, strategy catalogue and systematic TP/SL brackets"
requires-python = ">=3.11"
# eventkit / nest_asyncio come from ib_insync; no settings or dotenv layer is used.
dependencies = [
    "ib_insync>=0.9.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "streamlit>=1.28.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
# Only needed for the optional static charts in marketmind/backtester.py.
charts = ["matplotlib>=3.8.0"]

[project.scripts]
run-bot = "marketmind.live_trading:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"